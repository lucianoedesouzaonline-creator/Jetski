<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bússola & Painel Náutico</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            gap: 12px;
            overflow-y: auto;
            /* Permite rolar para ver os dados e histórico */
        }

        header {
            text-align: center;
            width: 100%;
            position: relative;
        }

        h2 {
            margin: 0;
            font-size: 16px;
            color: #4cc9f0;
            letter-spacing: 1px;
        }

        /* Botão de Pausa / Desligar Recursos no Topo */
        .btn-pausa {
            position: absolute;
            top: -2px;
            right: 10px;
            background: #581845;
            border: 2px solid #ff4d4d;
            color: #ff4d4d;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-pausa.pausado {
            background-color: #ff4d4d;
            color: #ffffff;
        }

        /* Painel Superior: Bússola + Radar */
        .painel-topo {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            justify-content: center;
            align-items: center;
        }

        /* Bússola (Esquerda) */
        .bussola-container {
            position: relative;
            width: 130px;
            height: 130px;
            border: 3px solid #4cc9f0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(28, 37, 65, 0.8);
            box-shadow: 0 0 10px rgba(76, 201, 240, 0.3);
            flex-shrink: 0;
        }

        #graus {
            font-size: 26px;
            font-weight: bold;
            color: #ffcc00;
        }

        /* Radar de Trilha (Direita - Clicável para Zoom) */
        .radar-container {
            width: 180px;
            height: 180px;
            background: #1c2541;
            border: 4px solid #4cc9f0;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(76, 201, 240, 0.3);
            cursor: pointer;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        /* Zoom Ativo */
        .radar-container.zoom-ativo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            height: 90vw;
            max-width: 380px;
            max-height: 380px;
            z-index: 1000;
            border-width: 6px;
        }

        .overlay-zoom {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
        }

        .overlay-zoom.ativo {
            display: block;
        }

        .horario-zoom {
            display: none;
            position: absolute;
            top: 15px;
            right: 20px;
            background: #1c2541;
            padding: 6px 12px;
            border-radius: 6px;
            border: 2px solid #ffcc00;
            font-family: monospace;
            font-size: 16px;
            color: #ffcc00;
            font-weight: bold;
            z-index: 1001;
        }

        .radar-container.zoom-ativo~.horario-zoom {
            display: block;
        }

        /* Controles de Modo: Volta (Esquerda) / Ida (Direita) */
        .controles-trilha {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        .btn-modo {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            opacity: 0.5;
        }

        #btn-volta {
            background-color: #581845;
            color: #ffffff;
        }

        #btn-ida {
            background-color: #ffcc00;
            color: #0b132b;
        }

        .ativo {
            opacity: 1 !important;
            box-shadow: 0 0 10px #ffffff;
        }

        /* Card de Informações Principal (Logo abaixo) */
        .card-info {
            background-color: #1c2541;
            width: 100%;
            max-width: 400px;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-left: 4px solid #4cc9f0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            border-bottom: 1px solid #3a4a7f;
            padding-bottom: 4px;
        }

        .info-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .info-label {
            color: #90e0ef;
            font-weight: bold;
        }

        .info-value {
            font-family: monospace;
            font-size: 14px;
            text-align: right;
        }

        /* Histórico Expandido para 4 Passos (Um abaixo do outro / Grade vertical) */
        .card-miniaturas {
            background-color: #1c2541;
            width: 100%;
            max-width: 400px;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border-left: 4px solid #ffcc00;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .miniaturas-titulo {
            font-size: 13px;
            color: #ffcc00;
            font-weight: bold;
        }

        .miniaturas-lista {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .miniatura-item {
            display: flex;
            align-items: center;
            background: #0b132b;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #3a4a7f;
            gap: 12px;
        }

        .miniatura-item canvas {
            width: 50px;
            height: 50px;
            border: 2px solid #4cc9f0;
            border-radius: 50%;
            background: #1c2541;
            flex-shrink: 0;
        }

        .miniatura-info {
            font-family: monospace;
            font-size: 13px;
            color: #90e0ef;
        }

        .btn-permissao {
            width: 100%;
            max-width: 400px;
            padding: 14px;
            background-color: #4cc9f0;
            color: #0b132b;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="overlay-zoom" id="overlayZoom"></div>
    <div class="horario-zoom" id="horarioZoom">--:--:--</div>

    <header>
        <h2>PAINEL NÁUTICO PWA</h2>
        <button class="btn-pausa" id="btnPausa">⏸️ PAUSA</button>
    </header>

    <!-- Painel Superior: Bússola + Radar -->
    <div class="painel-topo">
        <div class="bussola-container" title="Bússola (Proa)">
            <div id="graus">--°</div>
        </div>
        <div class="radar-container" id="radarContainer" title="Toque para ampliar">
            <canvas id="radarCanvas" width="180" height="180"></canvas>
        </div>
    </div>

    <!-- Botões de Alternância: Volta (Esquerda) / Ida (Direita) -->
    <div class="controles-trilha">
        <button class="btn-modo" id="btn-volta">MODO: VOLTA</button>
        <button class="btn-modo ativo" id="btn-ida">MODO: IDA</button>
    </div>

    <!-- Card de Dados Principal -->
    <div class="card-info">
        <div class="info-row"><span class="info-label">Horário:</span><span id="relogio"
                class="info-value">--:--:--</span></div>
        <div class="info-row"><span class="info-label">Direção:</span><span id="direcao-card"
                class="info-value">Aguardando...</span></div>
        <div class="info-row"><span class="info-label">Velocidade:</span><span id="velocidade" class="info-value">0.0
                nós / 0.0 km/h</span></div>
        <div class="info-row"><span class="info-label">Latitude:</span><span id="lat" class="info-value">--</span></div>
        <div class="info-row"><span class="info-label">Longitude:</span><span id="lon" class="info-value">--</span>
        </div>
    </div>

    <!-- Histórico de 4 Passos (Um abaixo do outro) -->
    <div class="card-miniaturas">
        <span class="miniaturas-titulo">Últimos Registros (Até 4 Passos):</span>
        <div class="miniaturas-lista" id="listaMiniaturas">
            <div class="miniatura-item"><canvas id="mini0" width="50" height="50"></canvas><span class="miniatura-info"
                    id="label-mini0">Passo 1: Vazio</span></div>
            <div class="miniatura-item"><canvas id="mini1" width="50" height="50"></canvas><span class="miniatura-info"
                    id="label-mini1">Passo 2: Vazio</span></div>
            <div class="miniatura-item"><canvas id="mini2" width="50" height="50"></canvas><span class="miniatura-info"
                    id="label-mini2">Passo 3: Vazio</span></div>
            <div class="miniatura-item"><canvas id="mini3" width="50" height="50"></canvas><span class="miniatura-info"
                    id="label-mini3">Passo 4: Vazio</span></div>
        </div>
    </div>

    <button id="btn-ativar" class="btn-permissao">ATIVAR SENSORES & GPS</button>

    <script>
        const grausText = document.getElementById('graus');
        const direcaoCard = document.getElementById('direcao-card');
        const velocidadeText = document.getElementById('velocidade');
        const latText = document.getElementById('lat');
        const lonText = document.getElementById('lon');
        const relogioText = document.getElementById('relogio');
        const horarioZoom = document.getElementById('horarioZoom');
        const btnAtivar = document.getElementById('btn-ativar');
        const btnIda = document.getElementById('btn-ida');
        const btnVolta = document.getElementById('btn-volta');
        const btnPausa = document.getElementById('btnPausa');

        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const radarContainer = document.getElementById('radarContainer');
        const overlayZoom = document.getElementById('overlayZoom');

        const ctxMinis = [
            document.getElementById('mini0').getContext('2d'),
            document.getElementById('mini1').getContext('2d'),
            document.getElementById('mini2').getContext('2d'),
            document.getElementById('mini3').getContext('2d')
        ];
        const labelMinis = [
            document.getElementById('label-mini0'),
            document.getElementById('label-mini1'),
            document.getElementById('label-mini2'),
            document.getElementById('label-mini3')
        ];

        let modoAtual = 'ida';
        let trilhaIda = [];
        let trilhaVolta = [];
        let pontoInicial = null;
        let historicoPassos = [];
        let sistemaPausado = false;
        let watchID = null;

        // Botão de Pausa / Desligar Recursos
        btnPausa.addEventListener('click', () => {
            sistemaPausado = !sistemaPausado;
            if (sistemaPausado) {
                btnPausa.innerText = "▶️ RETOMAR";
                btnPausa.classList.add('pausado');
                // Desliga os recursos de hardware para economizar bateria
                if (watchID) navigator.geolocation.clearWatch(watchID);
                window.removeEventListener('deviceorientationabsolute', tratarOrientacao);
                window.removeEventListener('deviceorientation', tratarOrientacao);

                // Salva automaticamente o passo atual ao desligar/pausar
                registrarTrechoConcluido();
            } else {
                btnPausa.innerText = "⏸️ PAUSA";
                btnPausa.classList.remove('pausado');
                iniciarSensores();
            }
        });

        // Relógio
        setInterval(() => {
            const agora = new Date();
            const horaStr = agora.toTimeString().split(' ')[0];
            relogioText.innerText = horaStr;
            horarioZoom.innerText = horaStr;
        }, 1000);

        // Zoom no Radar
        radarContainer.addEventListener('click', () => {
            radarContainer.classList.toggle('zoom-ativo');
            overlayZoom.classList.toggle('ativo');
            desenharRadar();
        });
        overlayZoom.addEventListener('click', () => {
            radarContainer.classList.remove('zoom-ativo');
            overlayZoom.classList.remove('ativo');
            desenharRadar();
        });

        function registrarTrechoConcluido() {
            if (trilhaIda.length > 2 || trilhaVolta.length > 2) {
                const novoPasso = {
                    tipo: modoAtual.toUpperCase(),
                    ida: [...trilhaIda],
                    volta: [...trilhaVolta],
                    hora: new Date().toTimeString().split(' ')[0].substring(0, 5)
                };
                historicoPassos.unshift(novoPasso);
                if (historicoPassos.length > 4) historicoPassos.pop(); // Mantém até 4 passos
                atualizarMiniaturas();
            }
        }

        btnIda.addEventListener('click', () => {
            registrarTrechoConcluido();
            modoAtual = 'ida';
            btnIda.classList.add('ativo');
            btnVolta.classList.remove('ativo');
        });

        btnVolta.addEventListener('click', () => {
            registrarTrechoConcluido();
            modoAtual = 'volta';
            btnVolta.classList.add('ativo');
            btnIda.classList.remove('ativo');
        });

        function obterPontoCardinal(graus) {
            const direcoes = ["Norte", "Nordeste", "Leste", "Sudeste", "Sul", "Sudoeste", "Oeste", "Noroeste"];
            const index = Math.round((graus % 360) / 45);
            return direcoes[index % 8];
        }

        function desenharRadar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#1c2541';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#3a4a7f';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(90, 90, 65, 0, Math.PI * 2);
            ctx.stroke();

            if (trilhaIda.length > 0) {
                ctx.strokeStyle = '#ffcc00';
                ctx.lineWidth = 3;
                ctx.beginPath();
                trilhaIda.forEach((p, idx) => {
                    if (idx === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                });
                ctx.stroke();

                ctx.fillStyle = '#00ffcc';
                ctx.beginPath();
                ctx.arc(trilhaIda[0].x, trilhaIda[0].y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            if (trilhaVolta.length > 1) {
                ctx.strokeStyle = '#800020';
                ctx.lineWidth = 3;
                ctx.beginPath();
                trilhaVolta.forEach((p, idx) => {
                    if (idx === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                });
                ctx.stroke();
            }

            ctx.fillStyle = '#4cc9f0';
            ctx.beginPath();
            ctx.arc(90, 90, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function desenharMiniTrilha(targetCtx, passo) {
            targetCtx.clearRect(0, 0, 50, 50);
            targetCtx.fillStyle = '#1c2541';
            targetCtx.fillRect(0, 0, 50, 50);
            if (!passo) return;

            if (passo.ida && passo.ida.length > 1) {
                targetCtx.strokeStyle = '#ffcc00';
                targetCtx.lineWidth = 2;
                targetCtx.beginPath();
                passo.ida.forEach((p, idx) => {
                    const mx = 25 + (p.x - 90) * 0.2;
                    const my = 25 + (p.y - 90) * 0.2;
                    if (idx === 0) targetCtx.moveTo(mx, my);
                    else targetCtx.lineTo(mx, my);
                });
                targetCtx.stroke();
            }

            if (passo.volta && passo.volta.length > 1) {
                targetCtx.strokeStyle = '#800020';
                targetCtx.lineWidth = 2;
                targetCtx.beginPath();
                passo.volta.forEach((p, idx) => {
                    const mx = 25 + (p.x - 90) * 0.2;
                    const my = 25 + (p.y - 90) * 0.2;
                    if (idx === 0) targetCtx.moveTo(mx, my);
                    else targetCtx.lineTo(mx, my);
                });
                targetCtx.stroke();
            }
        }

        function atualizarMiniaturas() {
            for (let i = 0; i < 4; i++) {
                if (historicoPassos[i]) {
                    desenharMiniTrilha(ctxMinis[i], historicoPassos[i]);
                    labelMinis[i].innerText = `Passo ${i + 1} - ${historicoPassos[i].hora} (${historicoPassos[i].tipo})`;
                } else {
                    ctxMinis[i].clearRect(0, 0, 50, 50);
                    labelMinis[i].innerText = `Passo ${i + 1}: Vazio`;
                }
            }
        }

        function iniciarSensores() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === 'granted') window.addEventListener('deviceorientation', tratarOrientacao, true);
                }).catch(console.error);
            } else {
                if ('ondeviceorientationabsolute' in window) {
                    window.addEventListener('deviceorientationabsolute', tratarOrientacao, true);
                } else if ('ondeviceorientation' in window) {
                    window.addEventListener('deviceorientation', tratarOrientacao, true);
                }
            }

            if ('geolocation' in navigator) {
                watchID = navigator.geolocation.watchPosition((position) => {
                    if (sistemaPausado) return;

                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const speed_ms = position.coords.speed;

                    latText.innerText = lat.toFixed(5);
                    lonText.innerText = lon.toFixed(5);

                    if (speed_ms !== null && speed_ms > 0) {
                        const nos = (speed_ms * 1.94384).toFixed(1);
                        const kmh = (speed_ms * 3.6).toFixed(1);
                        velocidadeText.innerText = `${nos} nós / ${kmh} km/h`;
                    } else {
                        velocidadeText.innerText = "0.0 nós / 0.0 km/h";
                    }

                    if (!pontoInicial) {
                        pontoInicial = { lat: lat, lon: lon };
                    }

                    const deltaLat = (lat - pontoInicial.lat) * 111000;
                    const deltaLon = (lon - pontoInicial.lon) * 111000 * Math.cos(lat * Math.PI / 180);

                    const escala = 2.0;
                    const xCoord = 90 + (deltaLon * escala);
                    const yCoord = 90 - (deltaLat * escala);

                    const novoPontoCanvas = { x: xCoord, y: yCoord };

                    if (modoAtual === 'ida') {
                        trilhaIda.push(novoPontoCanvas);
                    } else {
                        trilhaVolta.push(novoPontoCanvas);
                    }

                    desenharRadar();

                }, (error) => {
                    console.error(error);
                    latText.innerText = "Erro GPS";
                }, {
                    enableHighAccuracy: true,
                    maximumAge: 1000,
                    timeout: 5000
                });
            }
        }

        function tratarOrientacao(event) {
            if (sistemaPausado) return;
            let compass = event.webkitCompassHeading || event.alpha;
            if (compass !== null && compass !== undefined) {
                let angulo = Math.round(360 - compass);
                if (angulo >= 360) angulo = 0;
                if (angulo < 0) angulo = Math.abs(angulo);

                grausText.innerText = `${angulo}°`;
                direcaoCard.innerText = obterPontoCardinal(angulo);
            }
        }

        btnAtivar.addEventListener('click', () => {
            btnAtivar.innerText = 'Ativado!';
            setTimeout(() => btnAtivar.style.display = 'none', 1000);
            iniciarSensores();
            desenharRadar();
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }
    </script>
</body>

</html>
