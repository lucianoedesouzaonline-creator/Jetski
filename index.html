<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bússola & Painel Náutico</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            gap: 10px;
        }

        header {
            text-align: center;
        }

        h2 {
            margin: 0;
            font-size: 16px;
            color: #4cc9f0;
            letter-spacing: 1px;
        }

        /* Container Principal do Topo (Flexível para mudar de direção em telas largas) */
        .painel-topo {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 400px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            /* Permite que os elementos se acomodem se o espaço mudar */
        }

        /* Bússola (Esquerda) */
        .bussola-container {
            position: relative;
            width: 130px;
            height: 130px;
            border: 3px solid #4cc9f0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(28, 37, 65, 0.8);
            box-shadow: 0 0 10px rgba(76, 201, 240, 0.3);
            flex-shrink: 0;
        }

        #graus {
            font-size: 26px;
            font-weight: bold;
            color: #ffcc00;
        }

        /* Radar de Trilha (Direita) */
        .radar-container {
            width: 180px;
            height: 180px;
            background: #1c2541;
            border: 4px solid #4cc9f0;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(76, 201, 240, 0.3);
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        /* Controles de Modo (Volta / Ida) */
        .controles-trilha {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 380px;
        }

        .btn-modo {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            opacity: 0.6;
        }

        #btn-volta {
            background-color: #581845;
            color: #ffffff;
        }

        #btn-ida {
            background-color: #ffcc00;
            color: #0b132b;
        }

        .ativo {
            opacity: 1 !important;
            box-shadow: 0 0 8px #ffffff;
        }

        /* Card de Informações */
        .card-info {
            background-color: #1c2541;
            width: 100%;
            max-width: 380px;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-left: 4px solid #4cc9f0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            border-bottom: 1px solid #3a4a7f;
            padding-bottom: 4px;
        }

        .info-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .info-label {
            color: #90e0ef;
            font-weight: bold;
        }

        .info-value {
            font-family: monospace;
            font-size: 14px;
            text-align: right;
        }

        /* Botão de Ativação */
        .btn-permissao {
            width: 100%;
            max-width: 380px;
            padding: 14px;
            background-color: #4cc9f0;
            color: #0b132b;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-permissao:active {
            background-color: #3a86ff;
            color: #fff;
        }

        /* MEDIA QUERY PARA TABLETS OU TELAS LARGAS (Modo Paisagem / Tablet) */
        @media (min-width: 600px) {
            body {
                justify-content: center;
                gap: 15px;
            }

            .painel-topo {
                max-width: 500px;
                gap: 20px;
            }

            .bussola-container {
                width: 160px;
                height: 160px;
            }

            #graus {
                font-size: 32px;
            }

            .radar-container {
                width: 220px;
                height: 220px;
            }

            /* Ajusta o canvas internamente se necessário via JS ou CSS */
            .card-info,
            .controles-trilha,
            .btn-permissao {
                max-width: 500px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>PAINEL NÁUTICO PWA</h2>
    </header>

    <!-- Bloco Superior: Bússola + Radar Gráfico -->
    <div class="painel-topo">
        <!-- Visor da Bússola -->
        <div class="bussola-container" title="Bússola (Proa)">
            <div id="graus">--°</div>
        </div>

        <!-- Radar Gráfico -->
        <div class="radar-container" title="Rastro Visual">
            <canvas id="radarCanvas" width="180" height="180"></canvas>
        </div>
    </div>

    <!-- Botões de Alternância: Volta (Esquerda) / Ida (Direita) -->
    <div class="controles-trilha">
        <button class="btn-modo" id="btn-volta">MODO: VOLTA</button>
        <button class="btn-modo ativo" id="btn-ida">MODO: IDA</button>
    </div>

    <!-- Bloco de Dados do GPS, Horário e Sensores -->
    <div class="card-info">
        <div class="info-row">
            <span class="info-label">Horário:</span>
            <span id="relogio" class="info-value">--:--:--</span>
        </div>
        <div class="info-row">
            <span class="info-label">Direção:</span>
            <span id="direcao-card" class="info-value">Aguardando...</span>
        </div>
        <div class="info-row">
            <span class="info-label">Velocidade:</span>
            <span id="velocidade" class="info-value">0.0 nós / 0.0 km/h</span>
        </div>
        <div class="info-row">
            <span class="info-label">Latitude:</span>
            <span id="lat" class="info-value">--</span>
        </div>
        <div class="info-row">
            <span class="info-label">Longitude:</span>
            <span id="lon" class="info-value">--</span>
        </div>
    </div>

    <!-- Botão de ativação de sensores -->
    <button id="btn-ativar" class="btn-permissao">ATIVAR SENSORES & GPS</button>

    <script>
        const grausText = document.getElementById('graus');
        const direcaoCard = document.getElementById('direcao-card');
        const velocidadeText = document.getElementById('velocidade');
        const latText = document.getElementById('lat');
        const lonText = document.getElementById('lon');
        const relogioText = document.getElementById('relogio');
        const btnAtivar = document.getElementById('btn-ativar');
        const btnIda = document.getElementById('btn-ida');
        const btnVolta = document.getElementById('btn-volta');

        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');

        let modoAtual = 'ida';
        let trilhaIda = [];
        let trilhaVolta = [];
        let pontoInicial = null;

        setInterval(() => {
            const agora = new Date();
            relogioText.innerText = agora.toTimeString().split(' ')[0];
        }, 1000);

        btnIda.addEventListener('click', () => {
            modoAtual = 'ida';
            btnIda.classList.add('ativo');
            btnVolta.classList.remove('ativo');
        });

        btnVolta.addEventListener('click', () => {
            modoAtual = 'volta';
            btnVolta.classList.add('ativo');
            btnIda.classList.remove('ativo');
        });

        function obterPontoCardinal(graus) {
            const direcoes = ["Norte", "Nordeste", "Leste", "Sudeste", "Sul", "Sudoeste", "Oeste", "Noroeste"];
            const index = Math.round((graus % 360) / 45);
            return direcoes[index % 8];
        }

        function desenharRadar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#1c2541';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#3a4a7f';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(90, 90, 65, 0, Math.PI * 2);
            ctx.stroke();

            if (trilhaIda.length > 1) {
                ctx.strokeStyle = '#ffcc00';
                ctx.lineWidth = 4;
                ctx.beginPath();
                trilhaIda.forEach((p, index) => {
                    if (index === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                });
                ctx.stroke();
            }

            if (trilhaVolta.length > 1) {
                ctx.strokeStyle = '#800020';
                ctx.lineWidth = 4;
                ctx.beginPath();
                trilhaVolta.forEach((p, index) => {
                    if (index === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                });
                ctx.stroke();
            }

            ctx.fillStyle = '#4cc9f0';
            ctx.beginPath();
            ctx.arc(90, 90, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        btnAtivar.addEventListener('click', () => {
            btnAtivar.innerText = 'Ativando...';

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === 'granted') iniciarBussola();
                }).catch(console.error);
            } else {
                iniciarBussola();
            }

            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition((position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const speed_ms = position.coords.speed;

                    latText.innerText = lat.toFixed(5);
                    lonText.innerText = lon.toFixed(5);

                    if (speed_ms !== null && speed_ms > 0) {
                        const nos = (speed_ms * 1.94384).toFixed(1);
                        const kmh = (speed_ms * 3.6).toFixed(1);
                        velocidadeText.innerText = `${nos} nós / ${kmh} km/h`;
                    } else {
                        velocidadeText.innerText = "0.0 nós / 0.0 km/h";
                    }

                    if (!pontoInicial) {
                        pontoInicial = { lat: lat, lon: lon };
                    }

                    const deltaLat = (lat - pontoInicial.lat) * 111000;
                    const deltaLon = (lon - pontoInicial.lon) * 111000 * Math.cos(lat * Math.PI / 180);

                    const escala = 2.0;
                    const xCoord = 90 + (deltaLon * escala);
                    const yCoord = 90 - (deltaLat * escala);

                    const novoPontoCanvas = { x: xCoord, y: yCoord };

                    if (modoAtual === 'ida') {
                        trilhaIda.push(novoPontoCanvas);
                    } else {
                        trilhaVolta.push(novoPontoCanvas);
                    }

                    desenharRadar();

                }, (error) => {
                    console.error(error);
                    latText.innerText = "Erro GPS";
                }, {
                    enableHighAccuracy: true,
                    maximumAge: 1000,
                    timeout: 5000
                });
            } else {
                alert('Geolocalização não suportada.');
            }

            btnAtivar.style.display = 'none';
            desenharRadar();
        });

        function iniciarBussola() {
            if ('ondeviceorientationabsolute' in window) {
                window.addEventListener('deviceorientationabsolute', tratarOrientacao, true);
            } else if ('ondeviceorientation' in window) {
                window.addEventListener('deviceorientation', tratarOrientacao, true);
            }
        }

        function tratarOrientacao(event) {
            let compass = event.webkitCompassHeading || event.alpha;
            if (compass !== null && compass !== undefined) {
                let angulo = Math.round(360 - compass);
                if (angulo >= 360) angulo = 0;
                if (angulo < 0) angulo = Math.abs(angulo);

                grausText.innerText = `${angulo}°`;
                direcaoCard.innerText = obterPontoCardinal(angulo);
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }
    </script>
</body>

</html>
